<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INFINITY MODZ — Gerador</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, sans-serif; background: #0a0a0f; color: #e6e6e6; margin: 0; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1a24; border-radius: 14px; padding: 28px; max-width: 480px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.5); position: relative; }
  h1 { color: #4ade80; font-size: 22px; text-align: center; margin: 0 0 8px; }
  .sub { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
  .step-title { color: #93c5fd; font-size: 15px; margin: 10px 0 20px; text-align: center; font-weight: 600; }
  button { width: 100%; background: #16a34a; color: #fff; border: 0; padding: 14px; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600; transition: all .2s; margin-bottom: 8px; }
  button:hover:not(:disabled) { background: #22c55e; }
  button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .key-box { background: #0f1117; border: 1px solid #4ade80; padding: 16px; border-radius: 10px; text-align: center; font-family: monospace; font-size: 15px; word-break: break-all; margin: 16px 0; color: #4ade80; font-weight: 700; letter-spacing: 1px; user-select: text; }
  .countdown { text-align: center; font-size: 14px; color: #94a3b8; margin-top: 8px; }
  .countdown .time { color: #fbbf24; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 18px; }
  .step { display: none; }
  .step.active { display: block; }
  .copy-btn { background: #334155; margin-top: 8px; }
  .copy-btn:hover { background: #475569; }
  .success { text-align: center; color: #4ade80; font-size: 26px; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; }
  .progress { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #334155; transition: all .3s; }
  .dot.done { background: #4ade80; }
  .dot.current { background: #fbbf24; box-shadow: 0 0 12px #fbbf24; }
  input { width: 100%; background: #0f1117; color: #e6e6e6; border: 1px solid #334155; padding: 12px; border-radius: 8px; font-size: 14px; font-family: monospace; text-align: center; letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; user-select: text; }
  .hint { text-align: center; color: #4ade80; font-size: 12px; margin-bottom: 16px; }
  .adm-btn { position: absolute; top: 12px; left: 12px; width: 34px; height: 34px; border-radius: 50%; background: transparent; color: #2a2a38; border: 0; font-size: 18px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; transition: all .2s; margin: 0; }
  .adm-btn:hover { background: #2a2a38; color: #4ade80; }
  .adm-title { color: #fbbf24; font-size: 18px; text-align: center; margin: 0 0 20px; font-weight: 700; letter-spacing: 1px; }
  .adm-label { color: #94a3b8; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .adm-row { margin-bottom: 16px; }
  .days-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .days-grid button { padding: 12px; background: #334155; margin: 0; }
  .days-grid button.active { background: #16a34a; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 100; }
  .toast.show { opacity: 1; }
  .toast.error { background: #dc2626; }
  .key-meta { text-align: center; color: #64748b; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="card">
  <button class="adm-btn" onclick="openAdmLogin()" title="ADM">⚙</button>

  <div class="step active" id="step0">
    <h1>🔑 INFINITY MODZ</h1>
    <div class="sub">Gere sua key grátis de 1 dia</div>
    <div class="hint" id="deviceHint">✔ Pronto para gerar</div>
    <button onclick="startFlow()" id="startBtn">GERAR KEY GRÁTIS</button>
  </div>

  <div class="step" id="step1"><div class="progress" id="progress1"></div><div class="step-title">FASE 1 DE 5</div><button id="btn1" disabled>AGUARDE...</button></div>
  <div class="step" id="step2"><div class="progress" id="progress2"></div><div class="step-title">FASE 2 DE 5</div><button id="btn2" disabled>AGUARDE...</button></div>
  <div class="step" id="step3"><div class="progress" id="progress3"></div><div class="step-title">FASE 3 DE 5</div><button id="btn3" disabled>AGUARDE...</button></div>
  <div class="step" id="step4"><div class="progress" id="progress4"></div><div class="step-title">FASE 4 DE 5</div><button id="btn4" disabled>AGUARDE...</button></div>
  <div class="step" id="step5"><div class="progress" id="progress5"></div><div class="step-title">FASE 5 DE 5</div><button id="btn5" disabled>AGUARDE...</button></div>

  <div class="step" id="stepDone">
    <div class="success">CONGRATULATIONS!</div>
    <div class="sub">Sua key de 1 dia foi gerada</div>
    <div class="key-box" id="keyOut">-</div>
    <button class="copy-btn" onclick="copyKey('keyOut', this)">📋 COPIAR KEY</button>
    <div class="countdown">Expira em: <span class="time" id="countdown">24:00:00</span></div>
  </div>

  <div class="step" id="stepAdmLogin">
    <div class="adm-title">🔒 ACESSO ADM</div>
    <div class="adm-row"><div class="adm-label">Senha</div><input type="password" id="admPass" placeholder="••••••••" autocomplete="off"></div>
    <button onclick="checkAdmPass()">ENTRAR</button>
    <button class="copy-btn" onclick="showStep('step0')">VOLTAR</button>
  </div>

  <div class="step" id="stepAdmPanel">
    <div class="adm-title">⚙ PAINEL ADM</div>
    <div class="adm-row">
      <div class="adm-label">Duração</div>
      <div class="days-grid">
        <button onclick="setDays(1, this)" class="active" data-days="1">1 dia</button>
        <button onclick="setDays(7, this)" data-days="7">7 dias</button>
        <button onclick="setDays(15, this)" data-days="15">15 dias</button>
        <button onclick="setDays(30, this)" data-days="30">30 dias</button>
      </div>
    </div>
    <div class="adm-row"><div class="adm-label">Personalizado (dias)</div><input type="number" id="admDays" value="1" min="1" max="99999"></div>
    <div class="adm-row"><div class="adm-label">Travar em um dispositivo?</div><input type="text" id="admDevice" placeholder="VAZIO = QUALQUER CELULAR" maxlength="16"></div>
    <button onclick="admGenerate()">GERAR KEY</button>
    <button onclick="admPermanent()" style="background:#f59e0b;">GERAR KEY PERMANENTE</button>
    <button onclick="admTest()" style="background:#0891b2;">GERAR KEY DE TESTE (1 SEG)</button>
    <div class="key-box" id="admKeyOut" style="display:none;">-</div>
    <div class="key-meta" id="admKeyMeta"></div>
    <button class="copy-btn" id="admCopyBtn" style="display:none;" onclick="copyKey('admKeyOut', this)">📋 COPIAR</button>
    <button class="copy-btn" onclick="showStep('step0')">VOLTAR</button>
  </div>
</div>

<script>
const SECRET = 0x5A7B9C;
const ADM_PASS = "infinity2011";
const PHASES = 5;
const WAIT_SEC = 5;

let countdownTimer = null;
let userDevice = "";
let admSelectedDays = 1;

/* =====================================================
   PEGA O DEVICE DA URL — se não tiver, usa GENÉRICO
   ===================================================== */
window.addEventListener("load", function() {
  var params = new URLSearchParams(window.location.search);
  var dev = (params.get("d") || "").trim().toUpperCase();

  if (dev.length >= 4) {
    userDevice = dev;
  } else {
    // SEM aviso, usa genérico (key não trava em device específico)
    userDevice = "GEN00000000";
  }
});

function hashDevice(device) {
  if (!device || device.length < 4) return "000000";
  // Se for o device genérico, retorna FFFFFF (key aberta = qualquer celular)
  if (device === "GEN00000000") return "FFFFFF";
  var h = 0;
  for (var i = 0; i < device.length; i++) {
    h = ((h << 5) - h + device.charCodeAt(i)) | 0;
  }
  h = Math.abs(h) & 0xFFFFFF;
  return h.toString(16).toUpperCase().padStart(6, "0");
}

function buildKey(device, seconds) {
  var expirySec = Math.floor(Date.now() / 1000) + seconds;
  var expiry36 = expirySec.toString(36).toUpperCase();
  var devHash = hashDevice(device);

  var tmp = ((expirySec % 100000) * 7919) + parseInt(devHash, 16);
  var check = (tmp ^ SECRET) & 0xFFFFFF;
  var checkHex = check.toString(16).toUpperCase().padStart(6, "0");

  return {
    key: "INFINITY-MODZ-" + expiry36 + "-" + devHash + "-" + checkHex,
    expirySec: expirySec
  };
}

function showToast(msg, isError) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(function() { t.className = "toast"; }, 2000);
}

function renderProgress(el, phase) {
  var html = "";
  for (var i = 1; i <= PHASES; i++) {
    var cls = i < phase ? "done" : i === phase ? "current" : "";
    html += '<div class="dot ' + cls + '"></div>';
  }
  el.innerHTML = html;
}

function showStep(id) {
  document.querySelectorAll(".step").forEach(function(s) { s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}

function setupPhase(n) {
  renderProgress(document.getElementById("progress" + n), n);
  var btn = document.getElementById("btn" + n);
  var remaining = WAIT_SEC;
  btn.disabled = true;
  btn.textContent = "AGUARDE " + remaining + "s...";

  var interval = setInterval(function() {
    remaining--;
    if (remaining > 0) {
      btn.textContent = "AGUARDE " + remaining + "s...";
    } else {
      clearInterval(interval);
      btn.disabled = false;
      btn.textContent = n === PHASES ? "PEGAR MINHA KEY →" : "CONTINUAR →";
    }
  }, 1000);

  btn.onclick = function() {
    if (btn.disabled) return;
    if (n === PHASES) revealKey();
    else { showStep("step" + (n + 1)); setupPhase(n + 1); }
  };
}

function startFlow() {
  showStep("step1");
  setupPhase(1);
}

function revealKey() {
  var r = buildKey(userDevice, 86400);
  document.getElementById("keyOut").textContent = r.key;
  showStep("stepDone");
  startCountdown(r.expirySec);
}

function startCountdown(expirySec) {
  var el = document.getElementById("countdown");
  if (countdownTimer) clearInterval(countdownTimer);
  function tick() {
    var now = Math.floor(Date.now() / 1000);
    var left = expirySec - now;
    if (left < 0) left = 0;
    var h = Math.floor(left / 3600);
    var m = Math.floor((left % 3600) / 60);
    var s = left % 60;
    el.textContent = String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    if (left === 0) { clearInterval(countdownTimer); el.textContent = "EXPIRADA"; }
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function copyKey(elId, btn) {
  var key = document.getElementById(elId).textContent;
  if (!key || key === "-") return;
  navigator.clipboard.writeText(key).then(function() {
    var orig = btn.textContent;
    btn.textContent = "✔ COPIADO!";
    setTimeout(function() { btn.textContent = orig; }, 1500);
  });
}

/* ============== PAINEL ADM ============== */
function openAdmLogin() {
  document.getElementById("admPass").value = "";
  showStep("stepAdmLogin");
}

function checkAdmPass() {
  var p = document.getElementById("admPass").value;
  if (p === ADM_PASS) {
    document.getElementById("admKeyOut").style.display = "none";
    document.getElementById("admCopyBtn").style.display = "none";
    document.getElementById("admKeyMeta").textContent = "";
    showStep("stepAdmPanel");
  } else {
    showToast("Senha incorreta", true);
  }
}

function setDays(n, btn) {
  admSelectedDays = n;
  document.querySelectorAll(".days-grid button").forEach(function(b) { b.classList.remove("active"); });
  btn.classList.add("active");
  document.getElementById("admDays").value = n;
}

function _admGenWithSeconds(seconds, label) {
  var dev = document.getElementById("admDevice").value.trim().toUpperCase();
  if (dev.length > 0 && dev.length < 4) { showToast("ID inválido (ou deixe vazio)", true); return; }

  var r = buildKey(dev, seconds);
  var keyBox = document.getElementById("admKeyOut");
  var copyBtn = document.getElementById("admCopyBtn");
  var meta = document.getElementById("admKeyMeta");

  keyBox.textContent = r.key;
  keyBox.style.display = "block";
  copyBtn.style.display = "block";

  var exp = new Date(r.expirySec * 1000).toLocaleString("pt-BR");
  meta.textContent = (dev ? "🔒 Travada no device " + dev : "🔓 Qualquer celular") + " • " + label + " • Expira: " + exp;
  showToast(label + " gerada!");
}

function admGenerate() {
  var custom = parseInt(document.getElementById("admDays").value);
  var days = custom >= 1 ? custom : admSelectedDays;
  if (!days || days < 1) { showToast("Dias inválidos!", true); return; }
  _admGenWithSeconds(days * 86400, "Key de " + days + " dia(s)");
}

function admPermanent() {
  _admGenWithSeconds(99999 * 86400, "Key PERMANENTE");
}

function admTest() {
  _admGenWithSeconds(1, "Key de TESTE (1 segundo)");
}
</script>
</body>
</html>
