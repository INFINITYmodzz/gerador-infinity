<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INFINITY MODZ — Gerador</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0a0a0f; color: #e6e6e6; margin: 0; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1a24; border-radius: 14px; padding: 28px; max-width: 480px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  h1 { color: #4ade80; font-size: 22px; text-align: center; margin: 0 0 8px; }
  .sub { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
  .step-title { color: #93c5fd; font-size: 15px; margin: 10px 0 20px; text-align: center; font-weight: 600; }
  button { width: 100%; background: #16a34a; color: #fff; border: 0; padding: 14px; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600; transition: all .2s; }
  button:hover:not(:disabled) { background: #22c55e; transform: translateY(-1px); }
  button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .key-box { background: #0f1117; border: 1px solid #4ade80; padding: 16px; border-radius: 10px; text-align: center; font-family: monospace; font-size: 15px; word-break: break-all; margin: 16px 0; color: #4ade80; font-weight: 700; letter-spacing: 1px; }
  .countdown { text-align: center; font-size: 14px; color: #94a3b8; margin-top: 8px; }
  .countdown .time { color: #fbbf24; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 18px; }
  .step { display: none; }
  .step.active { display: block; }
  .copy-btn { background: #334155; margin-top: 8px; }
  .copy-btn:hover { background: #475569; }
  .success { text-align: center; color: #4ade80; font-size: 26px; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; }
  .progress { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #334155; transition: all .3s; }
  .dot.done { background: #4ade80; }
  .dot.current { background: #fbbf24; box-shadow: 0 0 12px #fbbf24; }
</style>
</head>
<body>

<div class="card">
  <div class="step active" id="step0">
    <h1>🔑 INFINITY MODZ</h1>
    <div class="sub">Gere sua key grátis de 1 dia</div>
    <button onclick="startFlow()">GERAR KEY GRÁTIS</button>
  </div>

  <div class="step" id="step1">
    <div class="progress" id="progress1"></div>
    <div class="step-title">FASE 1 DE 5</div>
    <button id="btn1" disabled>AGUARDE...</button>
  </div>
  <div class="step" id="step2">
    <div class="progress" id="progress2"></div>
    <div class="step-title">FASE 2 DE 5</div>
    <button id="btn2" disabled>AGUARDE...</button>
  </div>
  <div class="step" id="step3">
    <div class="progress" id="progress3"></div>
    <div class="step-title">FASE 3 DE 5</div>
    <button id="btn3" disabled>AGUARDE...</button>
  </div>
  <div class="step" id="step4">
    <div class="progress" id="progress4"></div>
    <div class="step-title">FASE 4 DE 5</div>
    <button id="btn4" disabled>AGUARDE...</button>
  </div>
  <div class="step" id="step5">
    <div class="progress" id="progress5"></div>
    <div class="step-title">FASE 5 DE 5</div>
    <button id="btn5" disabled>AGUARDE...</button>
  </div>

  <div class="step" id="stepDone">
    <div class="success">CONGRATULATIONS!</div>
    <div class="sub">Sua key de 1 dia foi gerada com sucesso</div>
    <div class="key-box" id="keyOut">-</div>
    <button class="copy-btn" onclick="copyKey()">📋 COPIAR KEY</button>
    <div class="countdown">Expira em: <span class="time" id="countdown">24:00:00</span></div>
  </div>
</div>

<script>
const SECRET = 0x5A7B9C;
const PHASES = 5;
const WAIT_SEC = 5;

let currentPhase = 0;
let countdownTimer = null;
let keyExpirySec = 0;

function generateKey() {
  const expirySec = Math.floor(Date.now() / 1000) + 86400;
  keyExpirySec = expirySec;
  const expiry36 = expirySec.toString(36).toUpperCase();

  const tmp = (expirySec % 100000) * 7919;
  const check = (tmp ^ SECRET) & 0xFFFFFF;
  const checkHex = check.toString(16).toUpperCase().padStart(6, "0");

  return `INFINITY-MODZ-${expiry36}-${checkHex}`;
}

function renderProgress(el, phase) {
  let html = "";
  for (let i = 1; i <= PHASES; i++) {
    const cls = i < phase ? "done" : i === phase ? "current" : "";
    html += `<div class="dot ${cls}"></div>`;
  }
  el.innerHTML = html;
}

function showStep(id) {
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function setupPhase(n) {
  currentPhase = n;
  renderProgress(document.getElementById("progress" + n), n);
  const btn = document.getElementById("btn" + n);
  let remaining = WAIT_SEC;
  btn.disabled = true;
  btn.textContent = `AGUARDE ${remaining}s...`;

  const interval = setInterval(() => {
    remaining--;
    if (remaining > 0) {
      btn.textContent = `AGUARDE ${remaining}s...`;
    } else {
      clearInterval(interval);
      btn.disabled = false;
      btn.textContent = n === PHASES ? "PEGAR MINHA KEY →" : "CONTINUAR →";
    }
  }, 1000);

  btn.onclick = () => {
    if (btn.disabled) return;
    if (n === PHASES) revealKey();
    else { showStep("step" + (n + 1)); setupPhase(n + 1); }
  };
}

function startFlow() { showStep("step1"); setupPhase(1); }

function revealKey() {
  const key = generateKey();
  document.getElementById("keyOut").textContent = key;
  showStep("stepDone");
  startCountdown(keyExpirySec);
}

function startCountdown(expirySec) {
  const el = document.getElementById("countdown");
  if (countdownTimer) clearInterval(countdownTimer);

  function tick() {
    const now = Math.floor(Date.now() / 1000);
    let left = expirySec - now;
    if (left < 0) left = 0;
    const h = Math.floor(left / 3600);
    const m = Math.floor((left % 3600) / 60);
    const s = left % 60;
    el.textContent = String(h).padStart(2,"0") + ":" +
                     String(m).padStart(2,"0") + ":" +
                     String(s).padStart(2,"0");
    if (left === 0) { clearInterval(countdownTimer); el.textContent = "EXPIRADA"; }
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function copyKey() {
  const key = document.getElementById("keyOut").textContent;
  navigator.clipboard.writeText(key).then(() => {
    const btn = document.querySelector(".copy-btn");
    const orig = btn.textContent;
    btn.textContent = "✔ COPIADO!";
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}
</script>
</body>
    </html>
